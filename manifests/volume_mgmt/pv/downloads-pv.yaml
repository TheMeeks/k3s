apiVersion: v1
kind: PersistentVolume
metadata:
  name: downloads-pv
  namespace: servarr
  labels:
    type: local
spec:
  storageClassName: downloads
  capacity:
    storage: 180Ti
  accessModes:
    - ReadWriteMany
  hostPath:
    path: "/mnt/unraid/downloads"
  persistentVolumeReclaimPolicy: Retain
