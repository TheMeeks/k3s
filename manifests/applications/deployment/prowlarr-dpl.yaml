apiVersion: apps/v1
kind: Deployment
metadata:
  name: prowlarr
  namespace: servarr
spec:
  selector:
    matchLabels:
      app: prowlarr
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: prowlarr
    spec:
      volumes:
      - name: prowlarr-storage
        persistentVolumeClaim:
          claimName: prowlarr-pvc
      containers:
      - image: lscr.io/linuxserver/prowlarr:latest
        name: prowlarr
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        ports:
        - containerPort: 9696
          name: "prowlarr"
        volumeMounts:
        - name: prowlarr-storage
          mountPath: "/config"